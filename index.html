<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GEETECH SMS | Advanced School Management & Assessment System</title>
    <script>
      // Suppress expected Vite HMR WebSocket errors in the AI Studio environment
      const originalError = console.error;
      const originalWarn = console.warn;
      const suppress = (msg) => {
        if (!msg) return false;
        const str = String(msg).toLowerCase();
        return str.includes('websocket') || 
               str.includes('failed to connect') ||
               str.includes('closed without opened') ||
               str.includes('connection refused') ||
               str.includes('[vite]');
      };
      
      console.error = function(...args) {
        if (args[0] && suppress(args[0])) return;
        originalError.apply(console, args);
      };
      console.warn = function(...args) {
        if (args[0] && suppress(args[0])) return;
        originalWarn.apply(console, args);
      };
      
      window.addEventListener('unhandledrejection', function(event) {
        const reason = event.reason;
        const msg = (reason && (reason.message || String(reason))) || '';
        if (suppress(msg)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);

      // Prevent native browser engine WebSocket connection attempts for Vite HMR
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            if (urlStr.includes('/vite') || urlStr.includes('localhost') || urlStr.includes('127.0.0.1')) {
              // Return a stub WebSocket that mimics a connecting and closing socket without an actual network request
              const mockWS = {
                url: urlStr,
                readyState: 0, // CONNECTING
                bufferedAmount: 0,
                extensions: "",
                protocol: protocols || "",
                binaryType: "blob",
                onopen: null,
                onerror: null,
                onclose: null,
                onmessage: null,
                addEventListener: function(type, listener) {
                  if (type === 'close') this.onclose = listener;
                  if (type === 'error') this.onerror = listener;
                  if (type === 'open') this.onopen = listener;
                  if (type === 'message') this.onmessage = listener;
                },
                removeEventListener: function() {},
                send: function() {},
                close: function() {
                  this.readyState = 3; // CLOSED
                  if (typeof this.onclose === 'function') {
                    this.onclose({ code: 1000, reason: "HMR Disabled", wasClean: true });
                  }
                }
              };
              setTimeout(() => {
                // Transition cleanly to closed without triggering any error events
                mockWS.readyState = 3;
                if (typeof mockWS.onclose === 'function') {
                  mockWS.onclose({ code: 1000, reason: "HMR Disabled", wasClean: true });
                }
              }, 100);
              return mockWS;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GEETECH SMS" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
